<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>注册验证码</title>
</head>
<body style="font-family: Arial, 'Microsoft YaHei', sans-serif; background-color: #f5f5f5; padding: 24px;">
<div style="max-width: 480px; margin: 0 auto; background: #ffffff; border-radius: 12px; padding: 32px; text-align: center;">
    <h2 style="color: #333; margin-top: 0;">OY Blog 注册验证码</h2>
    <p style="color: #666;">您正在注册 OY Blog 账号，请输入以下验证码完成注册：</p>
    <div style="font-size: 32px; font-weight: bold; letter-spacing: 8px; color: #6366f1; margin: 24px 0;"
         th:text="${code}">123456</div>
    <p style="color: #999; font-size: 13px;">验证码 <span th:text="${expireMinutes}">5</span> 分钟内有效，请勿泄露给他人。</p>
</div>
</body>
</html>
