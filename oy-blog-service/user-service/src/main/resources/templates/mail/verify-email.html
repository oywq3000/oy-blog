<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>邮箱验证</title>
</head>
<body style="font-family: Arial, 'Microsoft YaHei', sans-serif; background-color: #f5f5f5; padding: 24px;">
<div style="max-width: 480px; margin: 0 auto; background: #ffffff; border-radius: 12px; padding: 32px; text-align: center;">
    <h2 style="color: #333; margin-top: 0;">OY Blog 邮箱验证</h2>
    <p style="color: #666;">您好，<span th:text="${username}">用户</span>！请点击下方按钮完成邮箱验证：</p>
    <a th:href="${verifyUrl}"
       style="display: inline-block; margin: 24px 0; padding: 12px 32px; background-color: #6366f1; color: #ffffff; text-decoration: none; border-radius: 8px;">验证邮箱</a>
    <p style="color: #999; font-size: 13px;">链接 <span th:text="${expireHours}">24</span> 小时内有效。如果按钮无法点击，请复制以下链接到浏览器打开：</p>
    <p style="color: #6366f1; font-size: 12px; word-break: break-all;" th:text="${verifyUrl}"></p>
</div>
</body>
</html>
