server:
  port: 8093

app:
  host: http://localhost:5173 # 邮件验证链接前缀（指向前端 dev origin，生产改为部署域名）

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${SERVER_IP:192.168.200.130}:3306/oyblog?useUnicode=true&characterEncoding=UTF-8&serverTimezone=GMT%2B8&allowMultiQueries=true
    username: root
    password: root
  mail:
    # 真实 SMTP 通过环境变量注入，避免授权码提交进仓库
    # 设置方式：IDEA 运行配置 Environment variables，或命令行 export MAIL_USERNAME=xxx
    # QQ/163 邮箱：MAIL_PASSWORD 填授权码（不是登录密码）
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_TOKEN:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  data:
    redis:
      host: ${SERVER_IP:192.168.200.130}
      timeout: 10000
      client-type: lettuce
      lettuce:
        pool:
          max-active: 8 # 最大连接数
          max-wait: -1 # 最大阻塞等待时间（负数表示无限制）
          max-idle: 8 # 最大空闲连接数
          min-idle: 0 # 最小空闲连接数
  cloud:
    sentinel:
      enabled: true
      eager: true
      transport:
        dashboard: ${SERVER_IP:192.168.200.130}:8858
        port: 8719
      filter:
        url-patterns: /**

# ============ Logging Configuration ============
logging:
  level:
    com.oyproj: DEBUG
    org.springframework: WARN
  file:
    path: ./logs

feign:
  sentinel:
    enabled: true


