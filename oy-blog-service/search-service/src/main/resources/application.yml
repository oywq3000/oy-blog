server:
  port: 8099

spring:
  elasticsearch:
    uris: http://${ES_HOST:192.168.200.130}:9200
    # ES 账号密码：用户名留空 = 不启用认证（兼容未开启安全认证的 ES）
    username: ${ES_USERNAME:}
    password: ${ES_PASSWORD:}
    # 禁止 Spring Data 自动创建/修改索引，mapping 手动管理（见 doc/es-mysql-sync-mechanism.md）
    auto-create-index: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:192.168.200.130:9092}
    consumer:
      group-id: article-index
      # earliest：新消费组首启会从 topic 头读起 —— 这正好是"重建索引"的语义，
      # 切换当天能自动把播种进去的全量文章灌进 ES
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer 包住 JsonDeserializer：毒消息不再从 poll() 抛出，
      # 而是变成带 DeserializationException 头的记录，改走 @RetryableTopic 的重试→DLT 通道。
      # 缺了这层，毒消息会反复重抛、位点永不前进、分区永久卡死。
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.oyproj.common.mq.domain.ArticleIndexMessage
        spring.json.trusted.packages: com.oyproj.common.mq.domain
    producer:
      # @RetryableTopic 需要把失败记录转发到 retry topic，故消费端也需要生产者配置
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # 关掉类型头：否则消费端会按全限定类名反序列化，跨模块/改包名即炸
        # （与 spring.json.value.default.type 是一对，必须同时配）
        spring.json.add.type.headers: false
    listener:
      # 跨篇并行（spec §2.3 把"同篇保序 + 跨篇并行"列为迁移的真实升级——不配这里它就只是文档）：
      # 本模块只有 ArticleIndexConsumer 一个 @KafkaListener，所以这个值是服务级的。
      # 为什么安全：topic 有 3 个分区，key(=articleId) 恒定落在同一个分区，
      # 而一个分区在同一时刻只会被一个线程消费 → 同篇文章的记录顺序不变；
      # 并发带来的只是"不同分区之间并行"，也就是"不同文章之间并行"。
      # 不配的话：默认 concurrency=1，单个容器用一个线程跑全部 3 个分区，
      # 与 RabbitMQ 时代的全局串行等价（迁移的升级点之一落空）。
      # 注意：retry-1000/retry-2000 是 @RetryableTopic 按 TopicCreation 默认值建的 1 分区 topic，
      # 那两个容器会有 2 个空闲线程；重试链路上的记录本就是全局串行的，本次不动（改分区数要动 topic，属部署动作）。
      # 可环境变量覆盖（KAFKA_LISTENER_CONCURRENCY，同 MODERATION_CONCURRENCY 的做法）：
      # 每多一个消费线程就多一份拉取缓冲/反序列化开销，而本服务 mem_limit 只有 512m
      # （2026-09-13 重放实测峰值 489.6MiB = 95.6%，没有余量）。写死在这里意味着调低它要重新打包，
      # 部署期一旦发现内存吃紧就只能改 .env + 重启 —— 免重新打包。
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:3}

# ============ Logging Configuration ============
logging:
  level:
    com.oyproj: DEBUG
    org.springframework: WARN
  file:
    path: ./logs

# ============ ES-MySQL Sync Configuration ============
oy-blog:
  sync:
    # 对账间隔（毫秒），默认 30 分钟
    reconcile-interval-ms: 1800000
    # 启动后首次对账延迟（毫秒），默认 60 秒
    reconcile-initial-delay-ms: 60000

