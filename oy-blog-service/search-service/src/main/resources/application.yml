server:
  port: 8099

spring:
  elasticsearch:
    uris: http://${ES_HOST:192.168.200.130}:9200
    # ES 账号密码：用户名留空 = 不启用认证（兼容未开启安全认证的 ES）
    username: ${ES_USERNAME:}
    password: ${ES_PASSWORD:}
    # 禁止 Spring Data 自动创建/修改索引，mapping 手动管理（见 doc/es-mysql-sync-mechanism.md）
    auto-create-index: false
  rabbitmq:
    host: ${MQ_HOST:192.168.200.130}
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    # 开启消息确认
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        # 消费失败后拒绝重新入队（进入DLQ），最多重试3次
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
          multiplier: 2
          max-interval: 10000
        default-requeue-rejected: false

# ============ Logging Configuration ============
logging:
  level:
    com.oyproj: DEBUG
    org.springframework: WARN
  file:
    path: ./logs

# ============ ES-MySQL Sync Configuration ============
oy-blog:
  sync:
    # 对账间隔（毫秒），默认 30 分钟
    reconcile-interval-ms: 1800000
    # 启动后首次对账延迟（毫秒），默认 60 秒
    reconcile-initial-delay-ms: 60000

