server:
  port: 8091

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:192.168.200.130}:3306/oyblog?useUnicode=true&characterEncoding=UTF-8&serverTimezone=GMT%2B8&allowMultiQueries=true
    username: root
    password: root
    hikari:
      # 口径：审核并发 4 + HTTP 请求峰值 + 定时任务。两段事务只占毫秒级，正确性不依赖此值，
      # 显式声明只是让口径可见、可调（默认 10 也够用）。
      maximum-pool-size: ${DB_POOL_MAX:16}
  data:
    redis:
      host: ${REDIS_HOST:192.168.200.130}
      timeout: 10000
      client-type: lettuce
      lettuce:
        pool:
          max-active: 8 # 最大连接数
          max-wait: -1 # 最大阻塞等待时间（负数表示无限制）
          max-idle: 8 # 最大空闲连接数
          min-idle: 0 # 最小空闲连接数
  cloud:
    sentinel:
      enabled: true
      eager: true
      transport:
        dashboard: ${SENTINEL_HOST:192.168.200.130}:8858
        port: 8719
      filter:
        url-patterns: /**
  rabbitmq:
    host: ${MQ_HOST:192.168.200.130}
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    # 开启消息确认
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    # 审核消费者并发度（article-service 内唯一的 @RabbitListener，服务级配置只作用于它）。
    # 环境变量覆盖无需重新打包；天花板由 BlogAgent/DeepSeek 的并发额度决定，429 会被重试阶梯接住。
    listener:
      simple:
        concurrency: ${MODERATION_CONCURRENCY:4}
        # 每条消费者最多预取的在途消息数：默认 250 会让消息被单一消费者预取光（隐性串行）
        prefetch: ${MODERATION_PREFETCH:2}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:192.168.200.130:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        # 幂等生产者：第 0 层兜底从"确认送达"升级为"确认送达 + 不重复"。
        # 在 acks=all 且无冲突配置时这已是 Kafka 的默认值，显式写出来是把契约固定住 ——
        # 将来有人动 acks 或重试参数时，这一行会在评审里被看见。
        # 【必须写在 properties 里】KafkaProperties.Producer（Boot 3.4.11）没有 enableIdempotence
        # 绑定目标，写成 spring.kafka.producer.enable-idempotence 会被静默忽略、成为空操作
        # —— 与下面 max.block.ms 是同一条教训：只有 properties 透传才能进到 ProducerConfig。
        enable.idempotence: true
        # 关掉类型头：否则消费端会按全限定类名反序列化，跨模块/改包名即炸
        spring.json.add.type.headers: false
        # 【必须有】send() 是在用户请求线程上同步调用的。Kafka 的 max.block.ms 默认 60000ms，
        # broker 不可达或发送缓冲区满时 send() 会一直阻塞到超时才抛异常（然后被发布器的 catch 吞掉）——
        # 那意味着一次浏览/点赞接口最长卡 60 秒，直接违反"发事件失败绝不能影响用户浏览"这条契约。
        # 100ms 足以覆盖正常路径（发完即走），异常路径快速失败。
        # 只能写在这里：KafkaProperties.Producer 没有 maxBlockMs 绑定目标（Boot 3.4.11 可绑定键仅
        # acks/batchSize/bootstrapServers/bufferMemory/clientId/compressionType/keySerializer/
        # valueSerializer/retries/transactionIdPrefix），写成 spring.kafka.producer.max-block-ms
        # 会被静默忽略、成为空操作；只有 properties 透传才能进到 ProducerConfig。
        max.block.ms: 100
    consumer:
      group-id: article-hot-rank
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # 【必须包一层】ErrorHandlingDeserializer 把反序列化失败从 consumer.poll() 里移到记录级：
      # 毒消息变成一条 value=null + DeserializationException 头的普通记录，交给
      # KafkaErrorHandlingConfig 的 DefaultErrorHandler 跳过并记日志。
      # 直接用 JsonDeserializer 的话，异常会从 poll() 抛出 → DefaultErrorHandler.handleOtherException
      # 直接抛 IllegalStateException → 容器吞掉日志后回到轮询循环，同一条毒消息被反复拉取、
      # 位点永不前进：分区永久卡死 + 持续刷日志（等于把一条坏消息变成一次事故）。
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.oyproj.common.mq.domain.ArticleBehaviorEvent
        spring.json.trusted.packages: com.oyproj.common.mq.domain
    listener:
      ack-mode: manual


# ============ Logging Configuration ============
logging:
  level:
    com.oyproj: DEBUG
    org.springframework: WARN
  file:
    path: ./logs

feign:
  sentinel:
    enabled: true

# ============ MyBatis Plus Mapper XML ============
# 显式声明扫描路径：mapper/ 为默认约定目录；com/oyproj/dao/ 兼容既有统计 XML（UserArticleStatDao.xml 等）
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml,classpath*:/com/oyproj/dao/*.xml

# ============ MQ Retry Configuration ============
oy-blog:
  mq:
    # MQ 重试间隔（毫秒），默认 60 秒
    retry-interval-ms: 60000
    # 启动后首次重试延迟（毫秒），默认 30 秒
    retry-initial-delay-ms: 30000
  article:
    # ============ 热度加权公式配置 ============
    # 热度分 = views*views权重 + likes*likes权重 + comments*comments权重 + favorites*favorites权重
    hot-weight:
      views: 1
      likes: 2
      comments: 5
      favorites: 3
    # ============ 热榜配置 ============
    hot-rank:
      window-size: 200        # Redis 榜保留条数；请求页超出此窗口时回退 MySQL
      retention-days: 8       # 日桶保留天数
    # ============ 文章 AI 审核配置 ============
    moderation:
      enabled: true                 # 审核总开关
      exempt-roles: [ADMIN]         # 豁免角色（BlogRole.name()）
      base-url: ${AGENT_PYTHON_URL:http://localhost:8001}  # BlogAgent 审核端点
      timeout-ms: 30000
