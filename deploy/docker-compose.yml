# oy-blog 服务编排（部署在服务器 /home/oy/app/oyblogdeploy/oyblog-back/）
# 前提：MySQL/Redis/Nacos/ES/RabbitMQ/MinIO 已在服务器 Docker 跑通并发布端口
# 用法：cd /home/oy/app/oyblogdeploy/oyblog-back && docker compose up -d --build
# 说明：
#   - 所有 jar 平铺放在 ./jar/ 目录（build context）
#   - network_mode: bridge（docker0）：实测这台 NAS 的防火墙只放行 docker0 网段（172.17.x），
#     自定义 docker 网络到宿主机转发的流量会被拦截（oy-blog_default 和 oy-test-net 均复现失败）
#   - 中间件经 MYSQL_HOST/REDIS_HOST/NACOS_HOST 等按组件变量（Tailscale IP，宿主机已发布端口）访问，docker0 网段被防火墙放行
#   - 服务间互访靠 Nacos 注册的容器 IP（docker0 二层直连），不依赖 docker DNS
#   - 只有 gateway 对外发布 8080；业务端口 8091-8099 留在容器网络内部，不暴露局域网
#   - 敏感变量统一放同目录 .env（env_file 注入），见 deploy/docker-compose.env.example
#   - 内存贴边跑：.env 全局 JAVA_TOOL_OPTIONS 128m，gateway/article/search 在各自 environment 里覆盖
#   - 若 compose < 2.20 报 name: 不支持，删掉下面这行
name: oy-blog

x-common: &common
  restart: always
  network_mode: bridge   # docker0：唯一被 NAS 防火墙放行的容器网段
  pids_limit: 256        # 防线程爆炸拖死宿主机（重连风暴时每个容器最多 256 线程）
  env_file:
    - .env        # MYSQL_HOST / REDIS_HOST / NACOS_HOST / ES_HOST / MQ_HOST / MINIO_HOST / SENTINEL_HOST / TZ / JAVA_TOOL_OPTIONS / MAIL_* / ES_* / STORAGE_* 等全部放 .env

services:
  gateway:
    <<: *common
    image: oy-blog/gateway:1.0-SNAPSHOT
    container_name: oy-blog-gateway
    cpus: "0.8"          # 资源限制三件套：CPU 硬上限（NAS 8 核，7 个服务合计 6.2 核，给系统留 1.8 核保命）
    mem_limit: 320m      # Xmx96 + metaspace + 原生开销余量，超限 OOM kill（restart 自动拉起）
    build:
      context: ./jar
      dockerfile: ../docker/Dockerfile
      args:
        JAR_FILE: oy-blog-gateway-1.0-SNAPSHOT.jar
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx96m -XX:MaxMetaspaceSize=128m"   # 覆盖 .env 全局值（reactive 最轻）
    ports:
      - "8080:8080"          # 唯一对外端口
    volumes:
      - ./logs/oy-blog-gateway:/app/logs

  user-service:
    <<: *common
    image: oy-blog/user-service:1.0-SNAPSHOT
    container_name: oy-blog-user-service
    cpus: "1.0"
    mem_limit: 384m      # Xmx128
    build:
      context: ./jar
      dockerfile: ../docker/Dockerfile
      args:
        JAR_FILE: user-service-1.0-SNAPSHOT.jar
    volumes:
      - ./logs/user-service:/app/logs

  article-service:
    <<: *common
    image: oy-blog/article-service:1.0-SNAPSHOT
    container_name: oy-blog-article-service
    cpus: "1.2"
    mem_limit: 448m      # Xmx192（MyBatis + MQ 较重）
    build:
      context: ./jar
      dockerfile: ../docker/Dockerfile
      args:
        JAR_FILE: article-service-1.0-SNAPSHOT.jar
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx192m -XX:MaxMetaspaceSize=128m"   # MyBatis + MQ 较重
    volumes:
      - ./logs/article-service:/app/logs

  file-service:
    <<: *common
    image: oy-blog/file-service:1.0-SNAPSHOT
    container_name: oy-blog-file-service
    cpus: "0.8"
    mem_limit: 384m      # Xmx128
    build:
      context: ./jar
      dockerfile: ../docker/Dockerfile
      args:
        JAR_FILE: file-service-1.0-SNAPSHOT.jar
    volumes:
      - ./logs/file-service:/app/logs

  message-service:
    <<: *common
    image: oy-blog/message-service:1.0-SNAPSHOT
    container_name: oy-blog-message-service
    cpus: "0.4"
    mem_limit: 320m      # Xmx128（最轻，只有邮件）
    build:
      context: ./jar
      dockerfile: ../docker/Dockerfile
      args:
        JAR_FILE: message-service-1.0-SNAPSHOT.jar
    volumes:
      - ./logs/message-service:/app/logs

  search-service:
    <<: *common
    image: oy-blog/search-service:1.0-SNAPSHOT
    container_name: oy-blog-search-service
    cpus: "1.2"
    mem_limit: 448m      # Xmx192（ES 客户端较重）
    build:
      context: ./jar
      dockerfile: ../docker/Dockerfile
      args:
        JAR_FILE: search-service-1.0-SNAPSHOT.jar
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx192m -XX:MaxMetaspaceSize=128m"   # ES 客户端较重
    volumes:
      - ./logs/search-service:/app/logs

  agent-service:
    <<: *common
    image: oy-blog/agent-service:1.0-SNAPSHOT
    container_name: oy-blog-agent-service
    cpus: "0.8"
    mem_limit: 384m      # Xmx128
    build:
      context: ./jar
      dockerfile: ../docker/Dockerfile
      args:
        JAR_FILE: agent-service-1.0-SNAPSHOT.jar
    volumes:
      - ./logs/agent-service:/app/logs
