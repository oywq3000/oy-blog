server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/user-service/**
          filters:
            - StripPrefix=1
        - id: article-service
          uri: lb://article-service
          predicates:
            - Path=/article-service/**
          filters:
            - StripPrefix=1
        - id: file-service
          uri: lb://file-service
          predicates:
            - Path=/file-service/**
          filters:
            - StripPrefix=1
        - id: search-service
          uri: lb://search-service
          predicates:
            - Path=/search-service/**
          filters:
            - StripPrefix=1
        - id: agent-service
          uri: lb://agent-service
          predicates:
            - Path=/agent-service/**
          filters:
            - StripPrefix=1
          metadata:
            connect-timeout: 5000
            # SSE 长流（深度思考可能 30 秒以上无首包），SCG 默认 response-timeout 30s 会掐断，按路由调大
            response-timeout: 600000
  data:
    redis:
      host: 192.168.200.130
      timeout: 10000
      client-type: lettuce
      lettuce:
        pool:
          max-active: 8 # 最大连接数
          max-wait: -1 # 最大阻塞等待时间（负数表示无限制）
          max-idle: 8 # 最大空闲连接数
          min-idle: 0 # 最小空闲连接数

# ============ Logging Configuration ============
logging:
  level:
    com.oyproj: DEBUG
    org.springframework.cloud.gateway: WARN
    reactor.netty: WARN
  file:
    path: ./logs

auth:
  whitelist:
    - /user-service/auth/login
    - /user-service/auth/register
    - /user-service/auth/refresh
    - /user-service/profile/info/**
    - /article-service/article/read/**
    - /article-service/article/comment/*/comment-count
    - /article-service/article/comment/*/comments
    - /article-service/article/comment/*/replies
    - /article-service/article/interaction/*/view
    - /search-service/essearch/**
    # AI 助手：游客可聊（前端 SSE 用 fetch 手拼 token，游客为空），由 AuthenticationFilter 注入 x-user-id（真实 userId 或 guestId）
    # 安全底线：agent-service 内部所有写接口必须按 x-user-id 做 owner 校验
    - /agent/**
    - /health
    - /swagger-ui/**
    - /v3/api-docs/**



